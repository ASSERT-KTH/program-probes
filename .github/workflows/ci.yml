name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v8.1.0
        with:
          enable-cache: true

      - name: Cache HuggingFace models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('tests/test_tokenization.py') }}
          restore-keys: |
            huggingface-

      - name: Install test dependencies
        run: |
          uv sync --only-group test
          uv pip install -e . --no-deps

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v --ignore=tests/test_swebench_evaluate_modal.py
