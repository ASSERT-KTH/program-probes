[project]
name = "program-probes"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "accelerate>=0.30",
    "evalplus>=0.3",
    "wandb>=0.17",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "pydantic>=2.0",
    "pytest>=8.0",
    "scikit-learn>=1.8.0",
    "litellm>=1.83.14",
    "mini-swe-agent>=2.2.8",
    "modal>=1.4.2",
    "vllm>=0.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
extra-build-dependencies = { vllm = ["ninja", "numpy"] }
